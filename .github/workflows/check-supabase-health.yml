name: Verificar saúde da Supabase

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A run desta checagem mais recente JÁ CONCLUÍDA (nunca a atual, que
      # ainda está rodando) diz se a Supabase já estava fora do ar na última
      # vez — é assim que a rota sabe se, ao responder ok agora, é uma
      # recuperação (e deve avisar todo mundo por push) ou só mais uma
      # checagem de rotina com tudo normal (não avisa, senão manda push a
      # cada 5 minutos pra sempre).
      - name: Descobrir se a checagem anterior tinha falhado
        id: anterior
        run: |
          CONCLUSAO=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/workflows/check-supabase-health.yml/runs?status=completed&per_page=1" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.workflow_runs?.[0]?.conclusion||'nenhuma')}catch{console.log('nenhuma')}})")
          echo "conclusao=$CONCLUSAO" >> "$GITHUB_OUTPUT"

      # Se a Supabase estiver fora do ar, esse curl (com -f) falha e o
      # próprio GitHub manda e-mail automático pro dono do repositório —
      # não precisa de nenhum código nosso pra esse aviso de queda.
      - name: Checar Supabase (avisa recuperação se a checagem anterior tinha falhado)
        run: |
          curl -sf --connect-timeout 10 --max-time 30 -X GET \
            "https://hotmart-dashboard-woad.vercel.app/api/cron/check-supabase-health?anterior=${{ steps.anterior.outputs.conclusao }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
