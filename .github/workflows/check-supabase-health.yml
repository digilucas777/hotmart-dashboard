name: Verificar saúde da Supabase

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Conta quantas checagens JÁ CONCLUÍDAS seguidas (a mais recente pra trás)
      # falharam antes desta rodar — é o que diferencia um soluço isolado (1
      # falha, resolvido na próxima checagem, não merece aviso nenhum) de uma
      # queda de verdade (2+ falhas seguidas). Só olha as últimas 5 pra não
      # gastar chamada de API à toa.
      - name: Contar falhas seguidas antes desta checagem
        id: anterior
        run: |
          SEGUIDAS=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/workflows/check-supabase-health.yml/runs?status=completed&per_page=5" \
            | node -e "
              let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                try {
                  const runs = JSON.parse(d).workflow_runs || [];
                  let count = 0;
                  for (const r of runs) {
                    if (r.conclusion === 'failure') count++;
                    else break;
                  }
                  console.log(count);
                } catch { console.log(0) }
              })")
          echo "seguidas=$SEGUIDAS" >> "$GITHUB_OUTPUT"

      # Se a Supabase estiver fora do ar, esse curl (com -f) falha e o
      # próprio GitHub manda e-mail automático pro dono do repositório —
      # continua sendo a rede de segurança, independente do aviso por push
      # (que só dispara a partir da 2ª falha seguida, ver route.ts).
      - name: Checar Supabase (avisa queda/recuperação só se for 2+ falhas seguidas)
        run: |
          curl -sf --connect-timeout 10 --max-time 30 -X GET \
            "https://hotmart-dashboard-woad.vercel.app/api/cron/check-supabase-health?falhas_seguidas=${{ steps.anterior.outputs.seguidas }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
